<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Signing you in… — PlayHub</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F4F7FB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0F2540;
    }
    .card { text-align: center; padding: 24px; }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 16px;
      border: 3px solid #E5E9F0;
      border-top-color: #FF6A2C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 15px; opacity: 0.8; }
    a { color: #FF6A2C; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <p id="msg">Opening PlayHub…</p>
  </div>

  <script>
    // This page is the email-confirmation / invite / password-reset redirect
    // target for the Supabase hosted project (see SUPABASE_TODO.md "Add the
    // new deep-link URL to the Auth allow-list" — Site URL now points here
    // instead of directly at the ai.playhub:// custom scheme).
    //
    // Supabase appends the session token to whichever URL it redirects to —
    // as a URL fragment for the implicit flow, as a query string for the PKCE
    // flow. We never parse it ourselves: we just forward the EXACT, untouched
    // fragment/query onward, either into the native app's custom-scheme link
    // (which supabase_flutter's own internal deep-link listener already knows
    // how to read — unchanged from today) or into the web app's own root,
    // where the same Supabase client-side SDK auto-detects a session from the
    // URL on load. Parsing/rebuilding the token ourselves would risk a typo'd
    // param name silently breaking login.
    (function () {
      var raw = window.location.hash || window.location.search || '';
      var appLink = 'ai.playhub://login-callback' + raw;
      var webFallback = './' + raw;

      var appOpened = false;
      function markOpened() { appOpened = true; }
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) markOpened();
      });
      window.addEventListener('blur', markOpened);
      window.addEventListener('pagehide', markOpened);

      function continueOnWeb() {
        if (appOpened) return;
        document.getElementById('msg').textContent = 'Continuing in your browser…';
        window.location.replace(webFallback);
      }

      // No token at all (someone opened this page directly) — just go to the
      // web app; there's nothing to hand off to a native app.
      if (!raw) {
        continueOnWeb();
        return;
      }

      window.location.href = appLink;

      // If we're still here after a beat, the OS had nothing registered for
      // ai.playhub:// (app not installed, or a desktop browser) — continue
      // the flow on the web instead of leaving the user on a dead page.
      setTimeout(continueOnWeb, 1500);
    })();
  </script>

  <noscript>
    <p>JavaScript is required. <a href="./">Continue to PlayHub</a></p>
  </noscript>
</body>
</html>
