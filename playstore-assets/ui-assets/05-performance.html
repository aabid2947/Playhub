<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlayHub — Performance</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen">
  <!-- navy hero -->
  <div class="hero navy" style="padding:0 0 42px">
    <div class="statusbar on-dark">
      <span>9:41</span>
      <span class="sb-icons">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h4V12H2v10zm7 0h4V8H9v14zm7 0h4V2h-4v20z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21l3-3a4 4 0 00-6 0l3 3zm0-8a9 9 0 00-6.4 2.6l1.4 1.4a7 7 0 019.9 0l1.4-1.4A9 9 0 0012 13zm0-5C8 8 4.6 9.5 2 12l1.4 1.4A13 13 0 0112 10c3.3 0 6.3 1.2 8.6 3.4L22 12a17 17 0 00-10-4z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="18" height="10" rx="2"/><rect x="21" y="10" width="2.5" height="4" rx="1"/></svg>
      </span>
    </div>
    <div style="padding:6px 44px 0">
      <div class="row gap">
        <div class="icon-btn" style="background:rgba(255,255,255,.16)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff"><path d="M15 5l-7 7 7 7"/></svg></div>
        <div style="color:#fff"><div style="font-size:30px;opacity:.9">Performance</div><div class="hero-name" style="font-size:44px">Aarav Sharma</div></div>
      </div>
      <div class="row gap" style="margin-top:34px;align-items:flex-end">
        <div class="avatar av-1" style="width:150px;height:150px;font-size:58px;border:4px solid rgba(255,255,255,.35)">AS</div>
        <div style="color:#fff">
          <div class="row" style="align-items:flex-end;gap:16px"><span style="font-size:88px;font-weight:800;line-height:1">8.4</span><span style="font-size:36px;opacity:.85;padding-bottom:12px">/ 10</span></div>
          <div class="row gap" style="margin-top:8px"><span class="badge" style="background:rgba(22,163,74,.9);color:#fff"><span class="dot" style="background:#fff"></span>↑ 0.6 this term</span></div>
          <div style="font-size:26px;opacity:.9;margin-top:12px">Cricket · U-14 Juniors</div>
        </div>
      </div>
    </div>
  </div>

  <div class="content tight" style="overflow:hidden">
    <div class="section-title">Skill breakdown</div>
    <div class="card">
      <div class="skill-row"><div class="skill-head"><span class="s-name">Batting</span><span class="s-val">8.5</span></div><div class="progress"><span style="width:85%"></span></div></div>
      <div class="skill-row"><div class="skill-head"><span class="s-name">Bowling</span><span class="s-val">7.8</span></div><div class="progress"><span style="width:78%"></span></div></div>
      <div class="skill-row"><div class="skill-head"><span class="s-name">Fielding</span><span class="s-val">8.0</span></div><div class="progress"><span style="width:80%"></span></div></div>
      <div class="skill-row"><div class="skill-head"><span class="s-name">Fitness</span><span class="s-val">9.0</span></div><div class="progress"><span style="width:90%"></span></div></div>
    </div>

    <div class="section-title mt">Progress trend</div>
    <div class="card">
      <div class="barchart" style="height:280px">
        <div class="bcol"><div class="bar" style="height:60%"></div><div class="blabel">Nov</div></div>
        <div class="bcol"><div class="bar" style="height:66%"></div><div class="blabel">Dec</div></div>
        <div class="bcol"><div class="bar" style="height:72%"></div><div class="blabel">Jan</div></div>
        <div class="bcol"><div class="bar" style="height:80%"></div><div class="blabel">Feb</div></div>
        <div class="bcol peak"><div class="bar" style="height:84%"></div><div class="blabel">Mar</div></div>
      </div>
    </div>

    <div class="card" style="margin-top:24px;background:var(--orange-soft);border-color:var(--orange-muted)">
      <div class="row gap">
        <div class="avatar sm av-2">VS</div>
        <div><div style="font-size:27px;font-weight:600;color:var(--ink)">Coach Vikram · 12 Mar</div>
        <div class="muted" style="font-size:26px;margin-top:6px">"Excellent footwork this month. Focus on bowling line next term."</div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
