name: functions

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/functions.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Type-check the pure shared modules (no network imports).
      - run: deno check supabase/functions/_shared/billing.ts supabase/functions/_shared/schedule.ts
      # Unit tests for the extracted billing/schedule math + cron auth + webhook
      # signature verification. --allow-env for CRON_SECRET / webhook secret.
      - run: deno test --allow-env supabase/functions/_shared/
