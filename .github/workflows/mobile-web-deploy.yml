name: mobile-web-deploy

# Builds the Flutter WEB version of the mobile app (apps/mobile) and publishes
# it to GitHub Pages, on every push to `main`/`ui-revamo` (or a manual run).
# This is the same app as the Android build in ui-revamp-aab.yml — just
# compiled for a browser instead of a phone.
#
# HOSTING: GitHub Pages serves static files only, so this workflow does the
# real `flutter build web` here in CI (same Flutter version as the other
# mobile workflows) and hands the finished static output straight to Pages —
# no external host, no extra secrets beyond the two already reused below.
#
# Custom domain: served at playhub.co.in via the CNAME file written below.
# One-time setup this repo's owner must do at the DNS registrar: point
# playhub.co.in's A records at GitHub Pages (185.199.108/109/110/111.153).
#
# (SUPABASE_URL / SUPABASE_ANON_KEY already exist as repo secrets — reused
# as-is, same as the AAB build.)
on:
  push:
    branches: [main, ui-revamo]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'
          cache: true

      - run: flutter pub get

      - name: Build release web bundle
        run: >
          flutter build web --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Add custom domain marker
        run: echo "playhub.co.in" > build/web/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/build/web

      - id: deployment
        uses: actions/deploy-pages@v4
