name: release-aab

# Builds a Play-Store-format Android App Bundle on every push to `main` (or via
# a manual run) and uploads it as a downloadable artifact. Mirrors the proven
# ui-revamp-apk workflow — same runner, JDK, Flutter version and dart-defines —
# differing only in the build target (appbundle vs apk) and the pinned version.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/release-aab.yml'
  workflow_dispatch:

# A newer push to main cancels an in-flight build.
concurrency:
  group: release-aab-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'
          cache: true

      - run: flutter pub get

      # versionName 1.1 / versionCode 2 are pinned here rather than in
      # pubspec.yaml (still 0.1.0+1): build.gradle.kts reads them via
      # `flutter.versionName` / `flutter.versionCode`, which these flags
      # override. NOTE: the value is fixed, so every push to main produces
      # versionCode 2 — Play rejects a second upload with a versionCode it has
      # already seen. Bump this (or switch to github.run_number) per release.
      #
      # Supabase config rides in via repo secrets so the app boots past the
      # config guard to the login screen. If the secrets are unset the bundle
      # still builds; it just can't reach the backend.
      - name: Build release AAB (versionName 1.1, versionCode 2)
        run: >
          flutter build appbundle --release
          --build-name=1.1
          --build-number=2
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: playhub-aab-v1.1-${{ github.sha }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
