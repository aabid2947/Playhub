name: mobile

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'

defaults:
  run:
    working-directory: apps/mobile

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Integration harness + app-boot smoke, headless on flutter-tester.
      - run: flutter test integration_test/app_boot_test.dart -d flutter-tester
