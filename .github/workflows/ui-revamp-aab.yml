name: ui-revamp-aab

# Builds a release Android App Bundle (.aab) on every push to `main` or the
# `ui-revamo` branch (or via manual run) and uploads it as a downloadable
# artifact — the format Google Play requires for upload. Supersedes
# ui-revamp-apk.yml.
#
# SIGNING: when the ANDROID_KEYSTORE_* repo secrets are set, the build is signed
# with your stable upload key (decoded below into android/key.properties, which
# build.gradle.kts reads). If the secrets are absent the release build falls back
# to debug signing — fine for a smoke build, but Play needs the real key.
on:
  push:
    branches: [main, ui-revamo]
  workflow_dispatch:

# A newer push to the branch cancels an in-flight build.
concurrency:
  group: ui-revamo-aab-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  build-aab:
    runs-on: ubuntu-latest
    # Opt-out for device-test pushes: put "[skip aab]" in the commit message and
    # only the APK gets built (Play uploads need a fresh versionCode anyway, so
    # an .aab per test push is wasted CI). Manual runs always build.
    if: ${{ !contains(github.event.head_commit.message, '[skip aab]') }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'
          cache: true

      - run: flutter pub get

      # Decode the upload keystore from secrets and write key.properties so the
      # release signingConfig in build.gradle.kts uses it. Skipped (debug-signed
      # fallback) when the secret isn't set.
      - name: Configure release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured with upload keystore."

      # Supabase config rides in via repo secrets so the app boots past the
      # config guard. If the secrets are unset the bundle still builds; it just
      # can't reach the backend.
      # versionName 1.2 / versionCode 3 are pinned here rather than in
      # pubspec.yaml (kept in sync at 1.2.0+3) — build.gradle.kts reads
      # flutter.versionName/versionCode, which these flags override. NOTE: the
      # value is fixed, so every push emits versionCode 3 and Play rejects a
      # versionCode it has already seen. Bump per release, or switch to
      # ${{ github.run_number }}.
      - name: Build release app bundle (versionName 1.2, versionCode 3)
        run: >
          flutter build appbundle --release
          --build-name=1.2
          --build-number=3
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: playhub-aab-${{ github.sha }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
