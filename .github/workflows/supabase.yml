name: supabase

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'

jobs:
  lint-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations
        run: supabase db reset --no-seed
      - name: Stop
        if: always()
        run: supabase stop
